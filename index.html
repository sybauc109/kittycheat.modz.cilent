<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyanide v2 - Menu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            overflow: hidden;
            animation: hideSplash 0.1s ease 4.2s forwards;
        }

        #code-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #111111;
            font-size: 11px;
            font-weight: bold;
            overflow: hidden;
            pointer-events: none;
            padding: 10px;
            box-sizing: border-box;
            line-height: 1.2;
            z-index: 101;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #code-stream.show {
            opacity: 1;
        }

        .splash-img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            z-index: 102;
            opacity: 1;
            animation: showAndDisappear 0.8s ease forwards;
        }

        @keyframes showAndDisappear {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        @keyframes hideSplash {
            to { visibility: hidden; pointer-events: none; }
        }

        #intro-text-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #78288c 0%, #3a0842 100%);
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 105;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
        }

        #intro-text-screen.show {
            opacity: 1;
            visibility: visible;
        }

        .typing-text {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 25px rgba(168, 85, 247, 0.8);
            letter-spacing: 1px;
            border-right: 2px solid #a855f7;
            white-space: nowrap;
            padding-right: 4px;
        }

        #main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            opacity: 0;
            z-index: 10;
            visibility: hidden;
        }

        #main-content.show {
            visibility: visible;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .main-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .key-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 300px;
        }

        .key-input {
            width: 100%;
            padding: 16px;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            text-align: center;
            transition: all 0.3s;
        }

        .key-input::placeholder {
            color: #aaa;
        }

        .key-input:focus {
            border-color: #2ecc71;
            background-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 12px rgba(46, 204, 113, 0.4);
        }

        .key-btn {
            width: 100%;
            padding: 15px;
            background-color: #2ecc71;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }
        .key-btn:active { opacity: 0.8; }

        #mod-menu {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 360px;
            max-height: 85vh;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 20;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow-y: auto;
        }

        .menu-header-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 12px;
            border-radius: 12px;
        }

        .info-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 14px;
            font-size: 14px;
            color: #ddd;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-sizing: border-box;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
        }

        .info-item span:last-child {
            color: #2ecc71;
            font-weight: bold;
        }

        .add-happ-btn {
            width: 100%;
            padding: 13px;
            background-color: #e74c3c;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
            transition: opacity 0.2s;
        }
        .add-happ-btn:active { opacity: 0.8; }

        .hack-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hack-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 15px;
            color: white;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555;
            transition: .3s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 20px; width: 20px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #2ecc71; }
        input:checked + .slider:before { transform: translateX(24px); }

        #ios-notification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            background: rgba(35, 35, 35, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 999;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #ios-notification.show { top: 15px; }

        .notif-avatar {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            object-fit: cover;
        }

        .notif-content {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .notif-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            display: flex;
            justify-content: space-between;
        }

        .notif-text {
            font-size: 14px;
            color: #ddd;
        }
    </style>
</head>

            <div class="hack-item">

            </div>
            <div class="hack-item">

            </div>
            <div class="hack-item">
                <span>Aimbot</span>
                <label class="switch"><input type="checkbox" onchange="toggleFeature(this, 'Aimbot')"><span class="slider"></span></label>
            </div>
            <div class="hack-item">
                <span>No Recoil</span>
                <label class="switch"><input type="checkbox" onchange="toggleFeature(this, 'No Recoil')"><span class="slider"></span></label>
            </div>
            <div class="hack-item">
                <span>Aim Silent</span>
                <label class="switch"><input type="checkbox" onchange="toggleFeature(this, 'Aim Silent')"><span class="slider"></span></label>
            </div>
            <div class="hack-item">
                <span>Speed Hack X8</span>
                <label class="switch"><input type="checkbox" onchange="toggleFeature(this, 'Speed Hack')"><span class="slider"></span></label>

                <span>Antiban Safe Mode</span>
                <label class="switch"><input type="checkbox" checked onchange="toggleFeature(this, 'Antiban Safe Mode')"><span class="slider"></span></label>
            </div>
        </div>
    </div>

        let notifTimeout = null;

        function triggerNotification(message) {
            const notif = document.getElementById('ios-notification');
            const notifText = document.getElementById('notif-message-text');
            
            notifText.innerText = message;
            notif.classList.add('show');

            if (notifTimeout) clearTimeout(notifTimeout);

            notifTimeout = setTimeout(() => {
                notif.classList.remove('show');
            }, 3500);
        }

        function toggleFeature(checkbox, featureName) {
            if (checkbox.checked) {
                triggerNotification(`Rick: Đã Bật [${featureName}] thành công!`);
            } else {
                triggerNotification(`Rick: Đã Tắt [${featureName}].`);
            }
        }

        function openHappAndCopy() {
            const uuidPart1 = Math.random().toString(16).substring(2, 6).toUpperCase();
            const uuidPart2 = Math.random().toString(16).substring(2, 6).toUpperCase();
            const fullLink = `http://localhost:9898/Local/cyanide.html?18983E03-DD61-4EC0-8FF6-${uuidPart1}${uuidPart2}`;

            navigator.clipboard.writeText(fullLink).catch(() => {
                const textArea = document.createElement("textarea");
                textArea.value = fullLink;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
            });

            triggerNotification("Rick: đang mở app happ!");

            setTimeout(() => {
                window.location.href = "happ://"; 
            }, 800);
        }

            const randomUID = 'UID-' + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('display-uid').innerText = randomUID;

            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('display-ip').innerText = data.ip;
                })
                .catch(() => {
                    document.getElementById('display-ip').innerText = "192.168.1." + Math.floor(Math.random() * 200 + 10);
                });
        }

                'initializeSystem()', 'loadModules.js', 'verifyKeyDatabase(com.dts.freeifreth-com.dts.freefiremax)', 
                'bypassFreeFire.kitty', 'hookMethod_0x99()', 'patchMemoryAddress()', 
                'injectPayload_v2()', 'status: active', 'loadingCoreModules...', 
                'executingPayload()', '74927401830829284928348', 'authenticatingClient(73)'
            ];

            let interval;

            setTimeout(() => {
                codeStream.classList.add('show');
                interval = setInterval(() => {
                    const randomLine = lines[Math.floor(Math.random() * lines.length)];
                    const div = document.createElement('div');
                    div.innerText = '>> ' + randomLine;
                    codeStream.appendChild(div);
                    if (codeStream.childNodes.length > 25) {
                        codeStream.removeChild(codeStream.firstChild);
                    }
                }, 40);
            }, 800);

            setTimeout(() => {
                if (interval) clearInterval(interval);
                codeStream.style.opacity = '0';
                setTimeout(() => { codeStream.remove(); }, 300);

                const introScreen = document.getElementById('intro-text-screen');
                introScreen.classList.add('show');
                startTypewriter();
            }, 4200);
        });

        function startTypewriter() {
            const textToType = "by :Kitty•-•Zalo : 0939251990";
            const targetElement = document.getElementById('typewriter');
            let index = 0;

            function type() {
                if (index < textToType.length) {
                    targetElement.innerHTML += textToType.charAt(index);
                    index++;
                    setTimeout(type, 80);
                } else {
                    setTimeout(() => {
                        const introScreen = document.getElementById('intro-text-screen');
                        introScreen.style.opacity = '0';
                        setTimeout(() => {
                            introScreen.style.display = 'none';
                            document.getElementById('main-content').classList.add('show');
                        }, 500);
                    }, 1500);
                }
            }
            type();
        }

        function checkKey() {
            const inputVal = document.getElementById('key-input').value.trim();

            if (inputVal === '') {
                alert('Vui lòng nhập key!');
                return;
            }

            if (VALID_KEYS.has(inputVal)) {
                document.getElementById('main-content').style.display = 'none';
                document.getElementById('mod-menu').style.display = 'flex';
                loadClientInfo();
                triggerNotification("well well well");
            } else {
                alert('Key không hợp lệ!');
            }
        }
    </script>
